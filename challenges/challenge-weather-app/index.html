<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Meteoropolis</title>
    <link rel="stylesheet" href="assets/globals.css" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>

  <body>
    <!-- Structure -->
    <main class="content">
      <header class="header">
        <h1 class="title">
          <i>Meteor</i>
          <i>opolis</i>
        </h1>
      </header>

      <figure class="photo" id="photo"></figure>

      <div class="info">
        <p class="info__item info__item--conditions" id="conditions"></p>
        <p class="info__item info__item--credits">
          <a href="#" id="credit-user"></a>
          <span>on</span>
          <a href="#" id="credit-platform">Unsplash</a>
        </p>
      </div>

      <div class="thumbs" id="thumbs">
        <input
          class="search__input"
          id="search-tf"
          name="city"
          placeholder="Enter city name"
          autocomplete="city"
          style="height: 50px; width: 46%"
        />
        <button style="height: 50px" class="btn search__btn">Go</button>
      </div>

      <div class="controls">
        <div
          id="smallImages"
          style="display: flex; background-color: blue; height: 100px"
        ></div>
      </div>
    </main>

    <script>
      async function getWeather() {
        let city = "london";
        let info = await fetch(
          `http://api.openweathermap.org/data/2.5/weather?q=${city}&APPID=944c7d6eb18c20b5227a1d6028578e05`
        )
          .then((response) => response.json())
          .catch((error) => {
            throw new Error("Error");
          });
        let query = info.weather[0].description;
        let images = await fetch(
          `https://api.unsplash.com/search/photos?query=${query}&client_id=rFjekzFfQzet2DcZuW1kKXe8n9DHZHkp4zy2xGSbV3o`
        )
          .then((response) => response.json())
          .catch((error) => {
            throw new Error("Error");
          });
        let imageArray = [];

        let links = images.results;
        for (let i = 0; i < links.length; i++) {
          imageArray.push(links[i].urls.full);
        }
        const figure = document.getElementById("photo");
        const button = document.createElement("button");
        document.querySelector(".info").append(button);
        document.querySelector("#conditions").innerText =
          info.weather[0].description + "\n" + city;
        button.innerText = "Next";
        button.style.position = "absolute";
        button.style.left = "55%";
        button.style.bottom = "40px";
        button.style.borderRadius = "10px";
        const imageFigure = document.createElement("img");
        imageFigure.id = "imageFigure";
        figure.append(imageFigure);
        imageFigure.style.position = "absolute";
        let img = 0;
        const smallDiv = document.getElementById("smallImages");
        const div = document.querySelector(".controls");
        imageFigure.src = imageArray[0];

        const divHTML = div.innerHTML;
        let small = [];
        smallDiv.innerHTML = "";
        for (let i = 0; i < links.length; i++) {
          small[i] = document.createElement("img");
          small[i].src = links[i].urls.small;
          const width = 1000 / links.length;
          small[i].style.width = width.toString() + "px";
          smallDiv.append(small[i]);
          const url = imageArray[i];
          small[i].addEventListener("click", () => {
            small[i].style.border = "2px solid red";
            for (j = 0; j < imageArray.length; j++)
              if (j != i) small[j].style.border = "none";
            document.getElementById("imageFigure").src = url;
            img = i;
          });
        }
        button.addEventListener("click", () => {
          img = imageArray.indexOf(imageFigure.src) + 1;
          if (img === imageArray.length) img = 0;
          imageFigure.src = imageArray[img];
          small[img].style.border = "2px solid red";
          for (i = 0; i < imageArray.length; i++)
            if (i != img) small[i].style.border = "none";
        });

        const search = document.querySelector(".btn");
        search.style.position = "absolute";
        const input = document.getElementById("search-tf");
        input.style.position = "absolute";
        input.style.left = "60px";
        search.style.width = "40px";

        search.addEventListener("click", async () => {
          let city = document.getElementById("search-tf").value;
          let info = await fetch(
            `http://api.openweathermap.org/data/2.5/weather?q=${city}&APPID=944c7d6eb18c20b5227a1d6028578e05`
          )
            .then((response) => response.json())
            .catch((error) => {
              throw new Error("Error");
            });
          let query = info.weather[0].description;
          let images = await fetch(
            `https://api.unsplash.com/search/photos?query=${query}&client_id=rFjekzFfQzet2DcZuW1kKXe8n9DHZHkp4zy2xGSbV3o`
          )
            .then((response) => response.json())
            .catch((error) => {
              throw new Error("Error");
            });
          imageArray = [];
          let links = images.results;
          for (let i = 0; i < links.length; i++) {
            imageArray.push(links[i].urls.full);
          }
          document.querySelector("#conditions").innerText =
            info.weather[0].description + "\n" + city;
          imageFigure.src = imageArray[0];
          let small = [];
          smallDiv.innerHTML = "";
          for (let i = 0; i < links.length; i++) {
            small[i] = document.createElement("img");
            small[i].src = links[i].urls.small;
            const width = 1000 / links.length;
            small[i].style.width = width.toString() + "px";
            smallDiv.append(small[i]);
            const url = imageArray[i];
            small[i].addEventListener("click", () => {
              document.getElementById("imageFigure").src = url;
              small[i].style.border = "2px solid red";
              for (j = 0; j < imageArray.length; j++)
                if (j != i) small[j].style.border = "none";
              img = i;
            });
          }
          button.addEventListener("click", () => {
            img = imageArray.indexOf(imageFigure.src);
            if (img === imageArray.length) img = 0;
            imageFigure.src = imageArray[img];
            small[img].style.border = "2px solid red";
            for (i = 0; i < imageArray.length; i++)
              if (i != img) small[i].style.border = "none";
          });
        });
      }

      getWeather();
    </script>
  </body>
</html>
