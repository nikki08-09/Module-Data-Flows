<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <title>Meteoropolis</title>
    <link rel="stylesheet" href="assets/globals.css" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>

  <body>
    <!-- Structure -->
    <main class="content">
      <header class="header">
        <h1 class="title">
          <i>Meteor</i>
          <i>opolis</i>
        </h1>
      </header>

      <figure class="photo" id="photo"></figure>

      <div class="info">
        <p class="info__item info__item--conditions" id="conditions"></p>
        <p class="info__item info__item--credits">
          <a href="#" id="credit-user"></a>
          <span>on</span>
          <a href="#" id="credit-platform">Unsplash</a>
        </p>
      </div>

      <div class="thumbs" id="thumbs"></div>

      <div class="controls">
        <form class="search" id="search">
          <label class="search__label" for="search-tf">City</label>
          <input
            class="search__input"
            id="search-tf"
            name="city"
            placeholder="Enter city name"
            autocomplete="city"
          />
          <button class="btn search__btn">Go</button>
        </form>
      </div>
    </main>

    <script>
      async function getWeather() {
        let city = "london";
        let info = await fetch(
          `http://api.openweathermap.org/data/2.5/weather?q=${city}&APPID=944c7d6eb18c20b5227a1d6028578e05`
        )
          .then((response) => response.json())
          .catch((error) => {
            throw new Error("Error");
          });
        let query = info.weather[0].description;
        let images = await fetch(
          `https://api.unsplash.com/search/photos?query=${query}&client_id=rFjekzFfQzet2DcZuW1kKXe8n9DHZHkp4zy2xGSbV3o`
        )
          .then((response) => response.json())
          .catch((error) => {
            throw new Error("Error");
          });
        let imageArray = [];

        let links = images.results;
        for (let i = 0; i < links.length; i++) {
          imageArray.push(links[i].urls.full);
        }
      }
      getWeather();
    </script>
  </body>
</html>
